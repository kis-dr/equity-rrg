<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Equity RRG — 섹터 상대순환도</title>
<script src="./echarts.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --ink:#1a1c1f; --muted:#6b7280;
    --line:#e7e8ea; --accent:#1f6feb;
    --q-lead:#2ea043; --q-weak:#c98a00; --q-lag:#d33a49; --q-improve:#1f6feb;
    --font:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 40px}
  header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
  h1 .sub{font-weight:600;color:var(--muted);font-size:14px;margin-left:8px}
  .meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .meta code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f4f5f6;
    padding:1px 5px;border-radius:4px;color:#374151}
  .controls{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin:14px 0 10px}
  .slider-group{display:flex;align-items:center;gap:10px;font-size:13px;color:#374151;font-weight:600}
  input[type=range]{accent-color:var(--accent);width:190px;vertical-align:middle;cursor:pointer}
  .val{display:inline-block;min-width:2.2ch;text-align:center;font-weight:800;color:#111;
    border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums}

  .period{margin:2px 0 10px}
  .period-cap{font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
  .period-cap b{font-weight:800;color:#111;font-variant-numeric:tabular-nums}
  .track{position:relative;height:42px;background:#f6f7f8;border:1px solid var(--line);
    border-radius:8px;cursor:pointer;overflow:hidden;touch-action:none;user-select:none}
  .band{position:absolute;top:-1px;bottom:-1px;background:rgba(31,111,235,0.16);
    border:1.5px solid var(--accent);border-radius:6px;cursor:grab;box-sizing:border-box}
  .band:active{cursor:grabbing}
  .period-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
    margin-top:4px;font-variant-numeric:tabular-nums}

  .sectors{display:flex;flex-wrap:wrap;align-items:center;gap:9px 15px;
    padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin:0 0 6px}
  .sectors .tools{display:flex;gap:8px;margin-right:4px}
  button{font-family:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;
    color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer}
  button:hover{border-color:#c9cbcf} button:active{transform:translateY(1px)}
  select{font-family:inherit;font-size:12.5px;border:1px solid var(--line);background:#fff;
    color:var(--ink);border-radius:7px;padding:4px 8px;cursor:pointer;margin-left:4px}
  button.play{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;min-width:82px}
  button.play:hover{border-color:var(--accent);filter:brightness(0.96)}
  button.play.playing{background:#b91c1c;border-color:#b91c1c}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#374151;
    cursor:pointer;user-select:none}
  .chip input{cursor:pointer;margin:0}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
  #chart{width:100%;height:70vh;min-height:520px}
  .quadkey{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:#374151}
  .quadkey span{display:inline-flex;align-items:center;gap:6px}
  footer{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.7;
    border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Equity RRG<span class="sub">섹터 상대순환도</span></h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <div class="controls">
    <div class="slider-group">꼬리 길이
      <input type="range" id="tail" min="1" max="12" value="8" />
      <span class="val" id="tailVal">8</span><span style="font-weight:400;color:var(--muted)">주</span>
    </div>
    <div class="slider-group">
      <button id="animate" type="button" class="play">▶ 재생</button>
      <label style="font-weight:400;color:var(--muted)">속도
        <select id="speed"><option value="700">0.5x</option><option value="400" selected>1x</option><option value="200">2x</option></select>
      </label>
    </div>
  </div>

  <div class="period">
    <div class="period-cap">조회기간 &nbsp;<b id="periodLabel">–</b></div>
    <div class="track" id="track"><div class="band" id="band"></div></div>
    <div class="period-ends"><span id="trackStart"></span><span id="trackEnd"></span></div>
  </div>

  <div class="sectors" id="sectors">
    <div class="tools">
      <button id="selAll" type="button">전체 선택</button>
      <button id="selNone" type="button">전체 해제</button>
    </div>
  </div>

  <div id="chart"></div>

  <div class="quadkey">
    <span><i class="dot" style="background:var(--q-lead)"></i>우상 · 선도 Leading (강세·모멘텀↑)</span>
    <span><i class="dot" style="background:var(--q-weak)"></i>좌상 · 약화 Weakening (강세·모멘텀↓)</span>
    <span><i class="dot" style="background:var(--q-lag)"></i>좌하 · 후행 Lagging (약세·모멘텀↓)</span>
    <span><i class="dot" style="background:var(--q-improve)"></i>우하 · 개선 Improving (약세·모멘텀↑)</span>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const PALETTE = ['#1f6feb','#e8710a','#2ea043','#d6336c','#8250df','#00897b',
                 '#b45309','#0891b2','#65a30d','#ca8a04','#4f46e5','#64748b','#be123c'];
const color = i => PALETTE[i % PALETTE.length];

function quadName(x, y){
  if (x >= 50 && y >= 0) return '선도 Leading';
  if (x <  50 && y >= 0) return '약화 Weakening';
  if (x <  50 && y <  0) return '후행 Lagging';
  return '개선 Improving';
}

let DATA = null, chart = null;
// startIdx = 조회기간 창의 시작 주 인덱스, 창 폭 = tailLen
const state = { tailLen:8, startIdx:0, checked:new Set(), playing:false,
                bounds:{xmin:40,xmax:60,ymin:-5,ymax:5} };
const N = () => DATA.dates.length;
const clampStart = s => Math.max(0, Math.min(N() - state.tailLen, s));

// 현재 보이는 창(선택 섹터 × 조회기간)에 맞춰 축 범위를 기준선 중심으로 자동 산출
function computeBounds(){
  let dx=0, dy=0, any=false;
  DATA.series.forEach((s)=>{
    if(!state.checked.has(s.name)) return;
    const end = Math.min(s.points.length, state.startIdx + state.tailLen);
    for(let i=state.startIdx; i<end; i++){
      const p = s.points[i];
      if(!p) continue;
      dx = Math.max(dx, Math.abs(p[0]-50));
      dy = Math.max(dy, Math.abs(p[1]-0));
      any = true;
    }
  });
  if(!any){ dx=10; dy=5; }
  const px = Math.max(dx*1.12, 3), py = Math.max(dy*1.12, 1.5);
  state.bounds = { xmin:50-px, xmax:50+px, ymin:-py, ymax:py };
}

function backgroundSeries(){
  const b=state.bounds, xmin=b.xmin, xmax=b.xmax, ymin=b.ymin, ymax=b.ymax;
  const lbl = (txt,pos,c)=>({show:true, position:pos, formatter:txt,
      color:c, fontWeight:700, fontSize:12.5, opacity:0.9});
  return {
    id:'__bg__', name:'__bg__', type:'line', data:[], silent:true, z:0,
    markArea:{ silent:true, data:[
      [{coord:[50,0],    itemStyle:{color:'rgba(46,160,67,0.10)'},  label:lbl('선도 Leading','insideTopRight','#2ea043')},   {coord:[xmax,ymax]}],
      [{coord:[xmin,0],  itemStyle:{color:'rgba(201,138,0,0.10)'},  label:lbl('약화 Weakening','insideTopLeft','#c98a00')},  {coord:[50,ymax]}],
      [{coord:[xmin,ymin],itemStyle:{color:'rgba(211,58,73,0.09)'}, label:lbl('후행 Lagging','insideBottomLeft','#d33a49')},  {coord:[50,0]}],
      [{coord:[50,ymin], itemStyle:{color:'rgba(31,111,235,0.10)'}, label:lbl('개선 Improving','insideBottomRight','#1f6feb')}, {coord:[xmax,0]}],
    ]},
    markLine:{ silent:true, symbol:'none', label:{show:false},
      lineStyle:{color:'#9aa0a6', type:'dashed', width:1},
      data:[ {xAxis:50}, {yAxis:0} ] }
  };
}

function companySeries(){
  const out=[];
  DATA.series.forEach((s, idx)=>{
    if(!state.checked.has(s.name)) return;
    const c = color(idx);
    const wd = s.points.map((p,i)=> p ? {v:p, d:DATA.dates[i]} : null);
    const win = wd.slice(state.startIdx, state.startIdx + state.tailLen).filter(Boolean);
    if(!win.length) return;
    const lastI = win.length - 1;
    const data = win.map((o,i)=>{
      const head = (i===lastI);
      return {
        value:o.v, date:o.d,
        symbolSize: head ? 13 : 5,
        itemStyle: head ? {color:c, borderColor:'#fff', borderWidth:1.5}
                        : {color:c, opacity:0.72},
        label: head ? {show:true, position:'right', formatter:s.name,
                       fontSize:11, fontWeight:600, color:'#2b2f36'} : {show:false}
      };
    });
    out.push({
      id:s.name, name:s.name, type:'line', data, z:3,
      showSymbol:true, symbol:'circle',
      lineStyle:{width:1.6, color:c, opacity:0.5},
      labelLayout:{hideOverlap:true, moveOverlap:'shiftY'},
      emphasis:{focus:'series', lineStyle:{width:2.8, opacity:1}, label:{fontSize:12}}
    });
  });
  return out;
}

function allSeries(){ return [ backgroundSeries(), ...companySeries() ]; }

function baseOption(m){
  computeBounds();
  const b = state.bounds;
  return {
    animationDuration:400, animationDurationUpdate:260, animationEasingUpdate:'cubicOut',
    grid:{left:70, right:130, top:16, bottom:44},
    tooltip:{ trigger:'item', backgroundColor:'#fff', borderColor:'#e0e2e5',
      textStyle:{color:'#1a1c1f', fontSize:12.5},
      formatter:(p)=>{
        if(!p.data || p.data.value===undefined) return '';
        const x=p.data.value[0], y=p.data.value[1];
        return `<b>${p.seriesName}</b><br/>${p.data.date}<br/>`+
               `RSI(모멘텀): <b>${x.toFixed(1)}</b><br/>`+
               `초과수익률: <b>${y.toFixed(1)}%</b><br/>`+
               `<span style="color:#8a8f98">${quadName(x,y)}</span>`;
      }
    },
    xAxis:{ type:'value', name:'← 모멘텀 (RSI) →', nameLocation:'middle', nameGap:34,
      nameTextStyle:{fontSize:12.5, color:'#4b5563', fontWeight:600},
      min:b.xmin, max:b.xmax, splitLine:{lineStyle:{color:'#f0f1f2'}},
      axisLine:{lineStyle:{color:'#c9cbcf'}}, axisLabel:{color:'#6b7280'} },
    yAxis:{ type:'value', name:'초과수익률 % (상대강도)', nameLocation:'middle', nameGap:48,
      nameTextStyle:{fontSize:12.5, color:'#4b5563', fontWeight:600},
      min:b.ymin, max:b.ymax, splitLine:{lineStyle:{color:'#f0f1f2'}},
      axisLine:{lineStyle:{color:'#c9cbcf'}}, axisLabel:{color:'#6b7280'} },
    series: allSeries()
  };
}

function refresh(){
  computeBounds();
  const b = state.bounds;
  chart.setOption({
    xAxis:{ min:b.xmin, max:b.xmax },
    yAxis:{ min:b.ymin, max:b.ymax },
    series: allSeries()
  }, { replaceMerge:['series'] });
}

/* ---- 조회기간 밴드 위젯 ---- */
const track = () => document.getElementById('track');
const band  = () => document.getElementById('band');
function cellW(){ return track().clientWidth / N(); }

function layoutBand(){
  const cw = cellW();
  const e = Math.min(N()-1, state.startIdx + state.tailLen - 1);
  band().style.left  = (state.startIdx * cw) + 'px';
  band().style.width = (state.tailLen  * cw) + 'px';
  track().style.backgroundImage =
    `repeating-linear-gradient(90deg,#e7e8ea 0,#e7e8ea 1px,transparent 1px,transparent ${cw}px)`;
  document.getElementById('periodLabel').textContent =
    `${DATA.dates[state.startIdx]} ~ ${DATA.dates[e]} · ${state.tailLen}주`;
}

let dragging=false, grabOffset=0;
function idxUnderX(clientX){
  const r = track().getBoundingClientRect();
  return Math.floor((clientX - r.left) / cellW());
}
function onDown(e){
  stopAnim();
  const idx = Math.max(0, Math.min(N()-1, idxUnderX(e.clientX)));
  const inBand = idx >= state.startIdx && idx < state.startIdx + state.tailLen;
  if(inBand){
    grabOffset = idx - state.startIdx;
  } else {
    state.startIdx = clampStart(idx - Math.floor(state.tailLen/2));
    grabOffset = Math.max(0, Math.min(state.tailLen-1, idx - state.startIdx));
    layoutBand(); refresh();
  }
  dragging = true;
  try{ track().setPointerCapture(e.pointerId); }catch(_){}
}
function onMove(e){
  if(!dragging) return;
  state.startIdx = clampStart(idxUnderX(e.clientX) - grabOffset);
  layoutBand(); refresh();
}
function onUp(e){ dragging=false; try{ track().releasePointerCapture(e.pointerId); }catch(_){} }

/* ---- 애니메이션(재생): 밴드를 첫 구간 → 끝 구간까지 슬라이드 ---- */
let animTimer = null;
function speedMs(){ return parseInt(document.getElementById('speed').value,10) || 400; }
function stopAnim(){
  if(animTimer){ clearInterval(animTimer); animTimer=null; }
  state.playing = false;
  const b = document.getElementById('animate');
  if(b){ b.textContent='▶ 재생'; b.classList.remove('playing'); }
}
function startAnim(){
  const maxStart = N() - state.tailLen;
  if(maxStart <= 0) return;              // 창이 전체를 덮으면 이동할 구간 없음
  stopAnim();
  state.playing = true;
  const b = document.getElementById('animate');
  b.textContent = '⏸ 정지'; b.classList.add('playing');
  state.startIdx = 0; layoutBand(); refresh();
  animTimer = setInterval(()=>{
    if(state.startIdx >= maxStart){ stopAnim(); return; }
    state.startIdx = Math.min(maxStart, state.startIdx + 1);
    layoutBand(); refresh();
  }, speedMs());
}
function toggleAnim(){ if(state.playing) stopAnim(); else startAnim(); }

function buildSectors(){
  const box = document.getElementById('sectors');
  DATA.series.forEach((s, idx)=>{
    state.checked.add(s.name);
    const lab = document.createElement('label'); lab.className='chip';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.setAttribute('data-name', s.name);
    const dot = document.createElement('i'); dot.className='dot'; dot.style.background=color(idx);
    lab.append(cb, dot, document.createTextNode(s.name));
    box.appendChild(lab);
  });
  box.addEventListener('change', (e)=>{
    const cb = e.target; if(cb.tagName!=='INPUT') return;
    const name = cb.getAttribute('data-name');
    if(cb.checked) state.checked.add(name); else state.checked.delete(name);
    refresh();
  });
  document.getElementById('selAll').addEventListener('click', ()=>{
    box.querySelectorAll('input[type=checkbox]').forEach(cb=>{ cb.checked=true; state.checked.add(cb.getAttribute('data-name')); });
    refresh();
  });
  document.getElementById('selNone').addEventListener('click', ()=>{
    box.querySelectorAll('input[type=checkbox]').forEach(cb=>{ cb.checked=false; });
    state.checked.clear(); refresh();
  });
}

function render(){
  const m = DATA.meta, n = DATA.dates.length;
  state.tailLen  = Math.min(8, n);
  state.startIdx = clampStart(n - state.tailLen);   // 기본: 최근 창을 오른쪽 끝에

  document.getElementById('meta').innerHTML =
    `데이터 <code>${DATA.dates[0]}</code> ~ <code>${DATA.dates[n-1]}</code> `+
    `· ${m.n_weeks}주(주간) · ${m.n_series}개 시리즈 · `+
    `X=<code>RSI</code> · Y=<code>1년 초과수익률</code> · 생성 ${String(m.generated).replace('T',' ')}`;
  document.getElementById('foot').innerHTML =
    `축은 원본 스케일(기준선 X=50 / Y=0). X축=RSI는 절대 모멘텀, Y축=벤치마크 대비 1년 초과수익률. `+
    `조회기간 = 꼬리 길이만큼 폭이 고정된 창을 타임라인에서 드래그해 관측 시점을 지정. `+
    `StockCharts의 JdK RS-Ratio/Momentum(비공개 방식)과는 지표·정규화가 다릅니다.`;

  // 꼬리 슬라이더 (1..n)
  const tailEl = document.getElementById('tail');
  tailEl.min = 1; tailEl.max = n; tailEl.value = state.tailLen;
  document.getElementById('tailVal').textContent = state.tailLen;
  document.getElementById('trackStart').textContent = DATA.dates[0];
  document.getElementById('trackEnd').textContent   = DATA.dates[n-1];

  buildSectors();

  chart = echarts.init(document.getElementById('chart'));
  chart.setOption(baseOption(m));
  layoutBand();

  tailEl.addEventListener('input', ()=>{
    stopAnim();
    state.tailLen = parseInt(tailEl.value,10);
    document.getElementById('tailVal').textContent = state.tailLen;
    state.startIdx = clampStart(state.startIdx);
    layoutBand(); refresh();
  });
  const tk = track();
  tk.addEventListener('pointerdown', onDown);
  tk.addEventListener('pointermove', onMove);
  tk.addEventListener('pointerup', onUp);
  tk.addEventListener('pointercancel', onUp);

  document.getElementById('animate').addEventListener('click', toggleAnim);
  document.getElementById('speed').addEventListener('change', ()=>{ if(state.playing) startAnim(); });
}

window.addEventListener('resize', ()=>{ if(chart){ chart.resize(); layoutBand(); } });

fetch('./data.json', {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('data.json 로드 실패 ('+r.status+')'); return r.json(); })
  .then(d=>{ DATA=d; render(); })
  .catch(err=>{
    document.getElementById('meta').textContent = '데이터 로드 오류: '+err.message
      +' — 로컬에서 열었다면 python -m http.server 로 서버를 띄워 확인하세요.';
  });
</script>
</body>
</html>
